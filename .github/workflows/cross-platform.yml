name: Cross-platform

on:
  push:
  pull_request:

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11']
        node: ['20']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: python tools/codeavatar.py --help
      - run: python tools/codeavatar.py list
      - run: python packages/anchor-core/scripts/check_boundaries.py
      - run: npm run typecheck --workspace @anchor/studio
      - run: npm run still -- --help
