name: Cross-platform

on:
  push:
  pull_request:

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11']
        node: ['20']
    runs-on: ${{ matrix.os }}
    env:
      # windows-latest 控制台是 cp1252，工具链输出 ✅/❌/中文会 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: python tools/codeavatar.py --help
      - run: python tools/codeavatar.py list
      - run: python tools/codeavatar.py gate examples/sheet-S5.png
      - run: python packages/anchor-core/scripts/check_boundaries.py
      - run: python tools/coartic_check.py
      - run: python tools/coartic_check.py packages/anchor-core/scripts/speech-check.ts
      - run: python tools/coartic_check.py packages/anchor-core/scripts/intent-check.ts
      - run: python tools/coartic_check.py packages/anchor-core/scripts/motion-check.ts
      - run: python tools/coartic_check.py packages/anchor-core/scripts/style-check.ts
      - run: python tools/coartic_check.py packages/anchor-core/scripts/schema-check.ts
      - run: python tools/coartic_check.py packages/anchor-core/scripts/depth-check.ts
      - run: python tools/cli_check.py
      # 身份回归：15 张固定表演静帧（中性/情绪/意图/六口型极值/视角/契约边界值）
      # 结构 + 可分性；golden 字节比对待跨平台确定性验证一轮后收紧
      - run: python tools/identity_check.py no4 --no-golden
      # 仓库卫生：CRLF（git index 基准）/ bash 主入口 / 许可证扫描
      - run: python tools/repo_hygiene.py files
      - run: python tools/repo_hygiene.py licenses
      - run: npm run typecheck --workspace @anchor/studio
      # 真实渲染验收：六格口型表（含机检）+ 完整短视频导出 + npm 路线静帧
      - run: python tools/codeavatar.py grid no4
      - run: python tools/codeavatar.py render no4 -o out/clip.mp4 --props examples/perf.json
      - run: npm run still -- ../out/npm-still.png
      - run: npm run render -- ../out/npm-clip.mp4 --props=../examples/perf.json
      - run: >-
          python -c "import os,sys;
          bad=[p for p in ['out/clip.mp4','out/npm-clip.mp4','out/no4-grid.png','out/npm-still.png']
          if not os.path.isfile(p) or os.path.getsize(p)<10000];
          sys.exit('artifact check FAIL: %s' % bad) if bad else print('artifact check PASS')"
      - uses: actions/upload-artifact@v4
        with:
          name: render-${{ matrix.os }}
          path: |
            out/clip.mp4
            out/no4-grid.png
